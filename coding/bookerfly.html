<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Bookerfly</title>
        <style>
            * {
                font-size: 120%;
            }
            h1 {
                font-size: 3em;
                font-style: italic;
            }
            body {
                font-family: papyrus, georgia, serif;
                background: linear-gradient(#9ac4f1, #a6e6ff 70%, #797ee1);
                height: 99vh;
            }
            div {
                width: min-content;
                position: fixed;
                pointer-events: none;
            }
            @keyframes flap {
                from {transform: rotateX(0) }
                to {transform: rotateX(90deg) }
            }
            @keyframes vertical {
                to {transform: translateY(40vh) }
            }
            @keyframes horizontalR {
                to { right: 100vw }
            }
            @keyframes horizontalL {
                to { left: 100vw }
            }
        </style>
    </head>
</html>
